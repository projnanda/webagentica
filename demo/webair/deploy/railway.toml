# Railway config-as-code for the public WebAir demo origin.
#
# This file is the root of a deployment bundle that `deploy/bundle.py` assembles: the origin's
# code, its runtime requirements, exactly one signed agent package (agent.pkg), the signed
# WebAgents demo documents under demo/ (T8), and nothing else from this repository. See
# demo/webair/README.md, "Public deployment".

[build]
builder = "RAILPACK"

[deploy]
startCommand = "python -m origin --host 0.0.0.0 --agent-package agent.pkg --demo-documents demo"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
