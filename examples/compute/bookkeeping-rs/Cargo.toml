[package]
name = "webagents-compute-example-bookkeeping"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "A compute.v0 example module in Rust: identifier assignment, exact deduplication and quote matching for a literature-review graph; JSON in, JSON out, no imports."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
